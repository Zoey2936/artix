name: dependency-updates
on:
  push:
    branches:
      - develop
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  version-updates:
    name: ${{ matrix.name }}-update
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: plasma-login-manager-dinit
            repo: invent.kde.org/plasma/plasma-login-manager
    steps:
      - uses: actions/checkout@v7.0.1
      - name: update ${{ matrix.name }} version
        id: update
        run: |
          VER="$(
          git ls-remote --tags --refs https://${{ matrix.repo }}.git \
              | cut -d/ -f3 \
              | grep "^v[0-9.]\+$" \
              | grep -v "\.[89][0-9]$" \
              | sort -V \
              | tail -1 \
              | sed "s|^v||"
          )"
          OLD="$(sed -n "s|^pkgver=||p" ${{ matrix.name }}/PKGBUILD)"
          if [ "$VER" != "$OLD" ]; then
            sed -i "s|^pkgver=.*|pkgver=$VER|" ${{ matrix.name }}/PKGBUILD
            docker run --rm -v "$PWD/${{ matrix.name }}:/pkg" -w /pkg artixlinux/artixlinux:base-devel@sha256:bcf132f853cf3f9836e74f30e00bb8ab1882a1d61bd504dfe2dd8f2f8dfa1ee9 sh -ec "
              sed -i '1i Server = https://mirror1.artixlinux.org/repos/\$repo/os/\$arch' /etc/pacman.d/mirrorlist
              pacman -Syu --noconfirm --needed git pacman-contrib
              sed -i 's|(( EUID == 0 ))|false|' /usr/bin/makepkg
              SRCDEST=/tmp updpkgsums
            "
          fi
          echo "compare=https://${{ matrix.repo }}/compare/v$OLD...v$VER" >> $GITHUB_OUTPUT
          echo "version=$VER" >> $GITHUB_OUTPUT
      - uses: peter-evans/create-pull-request@v8.1.3
        with:
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          signoff: true
          delete-branch: true
          commit-message: update ${{ matrix.name }} version to ${{ steps.update.outputs.version }}
          branch: update-${{ matrix.name }}-version
          title: update ${{ matrix.name }} version to ${{ steps.update.outputs.version }}
          body: ${{ steps.update.outputs.compare }}
