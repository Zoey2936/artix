name: build
on:
  push:
    branches:
      - develop
  workflow_dispatch:
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  packages:
    runs-on: ubuntu-slim
    permissions:
      contents: read
    outputs:
      packages: ${{ steps.packages.outputs.packages }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: packages
        run: echo "packages=$(jq -n -c '$ARGS.positional | map(rtrimstr("/"))' --args */)" >> $GITHUB_OUTPUT

  build:
    runs-on: ubuntu-latest
    container: artixlinux/artixlinux:base-devel@sha256:bcf132f853cf3f9836e74f30e00bb8ab1882a1d61bd504dfe2dd8f2f8dfa1ee9
    permissions:
      contents: read
    needs: packages
    strategy:
      matrix:
        package: ${{ fromJSON(needs.packages.outputs.packages) }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: package
        env:
          GPG_PRIVKEY: ${{ secrets.GPG_PRIVKEY }}
        run: |
          sed -i '1i Server = https://mirror1.artixlinux.org/repos/$repo/os/$arch' /etc/pacman.d/mirrorlist
          pacman -Suy --noconfirm
          printenv GPG_PRIVKEY | gpg --batch --import
          sed -i 's/(( EUID == 0 ))/false/' /usr/bin/makepkg
          sed -i "s/^pkgrel=.*/pkgrel=${{ github.run_number }}/" ${{ matrix.package }}/PKGBUILD
          PKGDEST="$PWD/repo" makepkg -D ${{ matrix.package }} --syncdeps --noconfirm --sign
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.package }}
          path: repo

  deploy:
    runs-on: ubuntu-latest
    container: artixlinux/artixlinux:base-devel@sha256:bcf132f853cf3f9836e74f30e00bb8ab1882a1d61bd504dfe2dd8f2f8dfa1ee9
    permissions:
      pages: write
      id-token: write
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          path: repo
          merge-multiple: true
      - name: repo
        env:
          GPG_PRIVKEY: ${{ secrets.GPG_PRIVKEY }}
        run: |
          printenv GPG_PRIVKEY | gpg --batch --import
          repo-add --sign repo/custom.db.tar.gz repo/*.pkg.tar.zst
          gpg --armor --export | tee repo/zoey2936.asc
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: repo
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
