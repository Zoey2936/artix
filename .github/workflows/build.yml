name: build
on:
  push:
    branches:
      - develop
  workflow_dispatch:
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    container: artixlinux/artixlinux:base-devel@sha256:ee7603b921fb8b0df1991927ff7fd6ff30a9e8dc3009bf3712a3efd62e08f8c3
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: package
        env:
          GPG_PRIVKEY: ${{ secrets.GPG_PRIVKEY }}
        run: |
          sed -i '1i Server = https://mirror1.artixlinux.org/repos/$repo/os/$arch' /etc/pacman.d/mirrorlist
          pacman -Suy --noconfirm
          printenv GPG_PRIVKEY | gpg --batch --import
          sed -i 's/(( EUID == 0 ))/false/' /usr/bin/makepkg
          for dir in */; do PKGDEST="$PWD/repo" makepkg -D "$dir" --syncdeps --noconfirm --sign; done
          repo-add --sign repo/custom.db.tar.gz repo/*.pkg.tar.zst
          gpg --armor --export > repo/zoey2936.asc
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: repo
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
